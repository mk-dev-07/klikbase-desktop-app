name: Build Desktop Installers

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    build:
        permissions:
            contents: write

        name: Build on ${{ matrix.os }}
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: "npm"

            - name: Install Dependencies
              run: npm install

            # ─── INJECT SECRETS INTO APP BUNDLE ──────────────────────────────
            - name: Create Config File for B2 Secrets
              shell: bash
              run: |
                  echo '{
                    "B2_KEY_ID": "${{ secrets.B2_KEY_ID }}",
                    "B2_APPLICATION_KEY": "${{ secrets.B2_APPLICATION_KEY }}",
                    "B2_ENDPOINT": "${{ secrets.B2_ENDPOINT }}",
                    "B2_BUCKET": "${{ secrets.B2_BUCKET }}"
                  }' > config.json
            # ─────────────────────────────────────────────────────────────────
            - name: Package & Publish Electron App
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

                  CSC_LINK: ${{ secrets.CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
              run: npm run dist -- --publish always

            - name: Upload Installers & Update Metadata
              uses: actions/upload-artifact@v4
              with:
                  name: installers-${{ matrix.os }}
                  path: |
                      release/*.exe
                      release/*.dmg
                      release/*.deb
                      release/*.AppImage
                      release/*.zip
                      release/*.yml
                  retention-days: 7
